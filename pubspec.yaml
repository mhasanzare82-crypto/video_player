name: exm1
description: A maintainable local video player for Android.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
